name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "standardized/**"
      - "data_provenance.csv"
      - "data_estimates.csv"
      - "data_sources.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data.json
        run: python site/build.py

      - name: Stage deploy directory
        run: |
          mkdir -p _deploy/standardized
          cp -r site/. _deploy/
          cp -r standardized/trees _deploy/standardized/trees
          # In local dev the page lives at /site/ and reaches trees via
          # ../standardized/trees/. On Pages the page is the deploy root, so
          # trees are at ./standardized/trees/ — adjust TREES_BASE accordingly.
          sed -i 's|const TREES_BASE = "\.\./standardized/trees/";|const TREES_BASE = "standardized/trees/";|' _deploy/app.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
