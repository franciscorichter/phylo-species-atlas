tree:
  file: tree.nwk
  ntips: 90
  unique_ids: 90
  species_represented: 90
  coverage_pct_described: 0.1
  dated: true            # time-calibrated CIR chronogram (Wolfe 2019 Fig 3, Dryad folder L) now shipped
  multiple_individuals_per_species: false
  source:
    key: Wolfe 2019
    study: Wolfe JM et al. (2019)
    doi: 10.1098/rspb.2019.0079
    pdf: papers/tree.pdf
  methods:
    inference: bayesian
    software: ["PhyloBayes (CIR relaxed clock)", "ML, ASTRAL"]
    data_type: UCE
    n_loci: 410
    dating_method: "PhyloBayes CIR relaxed-clock chronogram on the fixed 410-locus AA topology, fossil-calibrated (Wolfe 2019 Fig 3 / Dryad folder L, file 2_cir.chronogram); 90 decapod tips, root ~466 Ma."
    support_metric: posterior_probability
    divergence_ci_available: true
    crown_ma: 465.9
    note: "DECAPODA ONLY — under-represents the Crustacea partition (~77k species), but now time-calibrated."

caveats:
  - severity: high
    summary: "Shipped tree is decapod-only — drastically narrower than the partition."
    detail: "Wolfe 2019's 90 tips cover only the order Decapoda. The Crustacea partition spans ~77k species across many orders (Amphipoda, Isopoda, Copepoda, Cirripedia, etc.). The 0.1% coverage shouldn't be interpreted as overall crustacean tree coverage."

dated_alternatives:
  reason_canonical_dated: |
    RESOLVED 2026-06: the atlas now ships Wolfe 2019's time-calibrated
    CIR chronogram (Figure 3; PhyloBayes relaxed clock on the fixed
    410-locus AA topology, fossil-calibrated), retrieved from Dryad
    folder L (doi:10.5061/dryad.k7505mn, 2_cir.chronogram). It carries 90
    decapod tips with branch lengths in Myr; the root at ~466 Ma places
    crown decapods in the Late Ordovician. Previously the atlas shipped
    the 95-tip substitution-unit topology (Dryad folder J file 1), which
    led the tree to be mis-described as undated. The remaining limitation
    is taxonomic scope (Decapoda only, ~77k partition species) — see
    caveats[0]. The candidates below are complementary dated trees for
    crustacean lineages outside Decapoda.
  candidates:
    - key: Oakley 2013
      doi: 10.1093/molbev/mss216
      study: "Oakley TH, Wolfe JM, Lindgren AR, Zaharoff AK (2013) — Phylotranscriptomics to bring the understudied into the fold: monophyletic Ostracoda, fossil placement, and pancrustacean phylogeny. Mol Biol Evol 30:215-233."
      scope: Pancrustacea backbone (broader than Decapoda)
      tips: ~30
      note: "Broader Pancrustacea-level dated phylogeny — useful for crustacean partition outside Decapoda (Ostracoda, Branchiopoda, etc.)."
    - key: Bracken-Grissom 2014
      doi: 10.1093/sysbio/syu008
      study: "Bracken-Grissom HD et al. (2014) — The emergence of Lobsters: phylogenetic relationships, morphological evolution and divergence time comparisons of an ancient group (Decapoda: Achelata, Astacidea, Glypheidea, Polychelida). Syst Biol 63:457-479."
      scope: Lobster-line decapods, dated
      tips: ~80
      note: "Sub-order dated tree; complementary depth for one decapod branch."

