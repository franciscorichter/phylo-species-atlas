    inference: bayesian
    software: ["Bayesian inference", "ML, ASTRAL"]
    data_type: UCE
    n_loci: 410
    dating_method: "410-loci anchored hybrid enrichment; 94 species / 58 families."
    support_metric: posterior_probability
    divergence_ci_available: true
