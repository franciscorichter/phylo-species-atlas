caveats:
  - severity: high
    summary: "Shipped tree is decapod-only — drastically narrower than the partition."
    detail: "Wolfe 2019's 95 tips cover only the order Decapoda. The Crustacea partition spans ~77k species across many orders (Amphipoda, Isopoda, Copepoda, Cirripedia, etc.). The 0.1% coverage shouldn't be interpreted as overall crustacean tree coverage."

dated_alternatives:
  reason_canonical_undated: |
    The canonical Wolfe 2019 tree IS time-calibrated — 410-locus
    anchored hybrid enrichment with Bayesian dating and divergence CIs
    (methods.divergence_ci_available: true; paper title includes
    "evolutionary timeline"). The CSV's dated=FALSE flag is stale and
    should be corrected at the build pipeline. The real limitation here
    is taxonomic scope (Decapoda only, ~77k partition species), not
    dating — see caveats[0].
  candidates:
    - key: Wolfe 2019 (canonical)
      doi: 10.1098/rspb.2019.0079
      study: "Wolfe JM et al. (2019) — A phylogenomic framework, evolutionary timeline and genomic resources for comparative studies of decapod crustaceans. Proc R Soc B 286:20190079."
      scope: Decapoda — same as the atlas canonical
      tips: 94
      note: "Canonical itself; the dating IS published — flag is wrong."
    - key: Oakley 2013
      doi: 10.1093/molbev/mss216
      study: "Oakley TH, Wolfe JM, Lindgren AR, Zaharoff AK (2013) — Phylotranscriptomics to bring the understudied into the fold: monophyletic Ostracoda, fossil placement, and pancrustacean phylogeny. Mol Biol Evol 30:215-233."
      scope: Pancrustacea backbone (broader than Decapoda)
      tips: ~30
      note: "Broader Pancrustacea-level dated phylogeny — useful for crustacean partition outside Decapoda (Ostracoda, Branchiopoda, etc.)."
    - key: Bracken-Grissom 2014
      doi: 10.1093/sysbio/syu008
      study: "Bracken-Grissom HD et al. (2014) — The emergence of Lobsters: phylogenetic relationships, morphological evolution and divergence time comparisons of an ancient group (Decapoda: Achelata, Astacidea, Glypheidea, Polychelida). Syst Biol 63:457-479."
      scope: Lobster-line decapods, dated
      tips: ~80
      note: "Sub-order dated tree; complementary depth for one decapod branch."

