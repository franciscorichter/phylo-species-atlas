caveats:
  - severity: high
    summary: "Largest unrepresented atlas clade (~500k estimated species)"
    detail: |
      ~55,000 described mites and ticks (paraphyletic group within
      Arachnida: Acariformes + Parasitiformes). Estimated total may
      exceed 1 million species. Klimov 2018 (Annu Rev Entomol) is the
      most recent dated phylogenomic synthesis but covers only ~200
      species across the two superorders. Pepato 2018 also produced
      dated Acariformes framework. NO atlas-scale species tree exists —
      mite phylogenetics is highly fragmented across families.

dated_alternatives:
  reason_canonical_undated: |
    Backbone phylogenomic dating exists separately for the two
    superorders (Acariformes via Pepato 2018; Parasitiformes via Klimov
    2018) but no combined Acari-wide species-level chronogram. With
    >100k undescribed species expected, comprehensive coverage is
    unrealistic.
  candidates:
    - key: Klimov 2018
      doi: 10.1146/annurev-ento-031616-035046
      study: "Klimov PB, Hubert J, Erban T, Pekár S, Klompen H (2018) — Comparative analysis of Acari... Annu Rev Entomol — phylogenomic synthesis."
      scope: Acari-wide phylogenomic review with dated framework
      tips: ~200
      note: "Most comprehensive recent synthesis spanning Acariformes + Parasitiformes."
    - key: Pepato 2018
      doi: 10.1093/sysbio/syy010
      study: "Pepato AR, Klimov PB (2018) — Phylogeny of mites (Acari) using transcriptomes: contains evidence on the phylogeny of Acariformes. Syst Biol 67:651-670."
      scope: Acariformes phylogenomic dated
      tips: ~50
      note: "Transcriptome-based Acariformes (mites) dated framework."
    - key: Dunlop 2009
      doi: 10.1098/rspb.2008.1700
      study: "Dunlop JA, Selden PA (2009) — Calibrating the chelicerate clock: a paleontological reply to Jeyaprakash and Hoy. Exp Appl Acarol 48:183-197."
      scope: Chelicerate fossil-calibrated framework including mites
      tips: ~30
      note: "Critical paleontological constraints for Acari deep-time dating."

