    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~4,500 described ciliates. Highly diverse — large unicellular eukaryotes with complex nuclear organization. Gao 2016 and Lynn 2017 published phylogenomic dated synthesis. Tetrahymena and Paramecium are model organisms with extensive data.

