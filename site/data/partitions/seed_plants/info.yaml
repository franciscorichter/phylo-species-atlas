tree:
  file: tree.nwk
  ntips: 342466                              # atlas-derived: one tip per species (pruned from 356305)
  derivation: |
    Derived from the Smith Brown 2018 ALLMB by pruning to a single
    representative per species (smallest numeric tip ID under each
    Genus_species). 3.5% subspecies/specimen-level redundancy in the
    original tree (~13.8k redundant tips, including the 2,457 subspecies-
    suffixed positions). Reproducible via scripts/derive_species_tree.py
    (~27 min for this 6 MB tree).
  species_represented: 342466
  coverage_pct_described: 89.3
  dated: true
  multiple_individuals_per_species: false
  source:
    key: Smith Brown 2018
    study: Smith SA, Brown JW (2018)
    doi: 10.1002/ajb2.1019
    pdf: papers/tree.pdf
  methods:
    inference: ml
    software: [RAxML, treePL]
    data_type: supermatrix
    n_loci: 7
    dating_method: "7-gene RAxML ML + treePL dating. Multi-stage build: ~80k species with sequence data, extended to ~356k via taxonomic placement."
    support_metric: bootstrap
    divergence_ci_available: false
    note: "Six tree variants (ALLMB/ALLOTB/GBMB/GBOTB + 2 dated). Atlas ships ALLMB. ~80k tips have direct sequence data; ~276k placed taxonomically — species-level placement confidence varies."

