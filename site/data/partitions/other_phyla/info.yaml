    note: "Two families (Peripatidae, Peripatopsidae). Sister to Tardigrada + Arthropoda (Panarthropoda)."
  - name: Placozoa
    described: 4
    estimated: 20
    note: "Simplest free-living animals — Trichoplax + 3 more genetic species described 2018-2022."
  - name: Loricifera
    described: 39
    estimated: 60
