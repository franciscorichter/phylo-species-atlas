caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~2,000 described Cercozoa. Heterotrophic flagellates and amoebae in Rhizaria. Sierra 2013 and Bass 2009 published phylogenomic frameworks. Single-cell eukaryotic data is sparse.

