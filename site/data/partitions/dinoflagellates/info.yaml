caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~2,300 described dinoflagellates. Major plankton group with diverse ecologies. Janouškovec 2017, Price 2018 published phylogenomic dated frameworks. Many cryptic species via 18S metabarcoding.

