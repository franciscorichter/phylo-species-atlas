dated_alternatives:
  reason_canonical_undated: |
    Zapata et al. 2014 published a time-calibrated chronogram (MCMCTree,
    relaxed clock with fossil calibrations) as Figure 4, but that
    chronogram was never deposited as a tree file — the atlas ships the
    transcriptome ML backbone phylogram (54 tips, substitution units),
    which is therefore undated (data_provenance.csv dated=FALSE is
    correct). Re-ingesting the calibrated tree would require obtaining the
    chronogram from the authors. A further limitation is scope (backbone
    only, 54 tips for ~65k partition species). Several larger sub-clade
    dated trees exist (below).
  candidates:
    - key: Uribe 2019
      doi: 10.1016/j.ympev.2018.12.019
      study: "Uribe JE, Irisarri I, Templado J, Zardoya R (2019) — New patellogastropod mitogenomes help counteracting long-branch attraction in the deep phylogeny of gastropod molluscs. Mol Phyl Evol 133:12-23."
      scope: Patellogastropoda (true limpets), dated mitogenomic
      tips: ~30
      note: "Sub-order dated tree with full mitogenomes; complements Zapata's transcriptome backbone."
    - key: Cunha 2019
      doi: 10.1101/736447
      study: "Cunha TJ, Giribet G (2019) — A phylogenomic framework for Vetigastropoda (Mollusca). Mol Phyl Evol — anchored phylogenomic dated framework."
      scope: Vetigastropoda — major sub-clade, dated
      tips: ~50
      note: "Sub-clade dated phylogeny for one of Zapata's five main lineages."
    - key: Aktipis 2010
      doi: 10.1111/j.1463-6409.2010.00468.x
      study: "Aktipis SW, Boehm AB, Giribet G (2011) — Another step towards understanding the slit-limpets (Fissurellidae, Fissurelloidea, Vetigastropoda, Gastropoda): a combined five-gene molecular phylogeny. Zool Scripta 40:238-259."
      scope: Fissurellidae (slit-limpets), fine-scale dated
      tips: ~60
      note: "Family-level dated tree; fine resolution for one vetigastropod family."

