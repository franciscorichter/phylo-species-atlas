# Mammals — partition metadata for the web app.
#
# Derived from the verified subset of audits/partitions/mammals.md and the
# paper's data_estimates.csv. The web app reads this file at build time;
# do not edit by hand once Phase B's `materialize` command exists.

partition: Mammals
slug: mammals
category: Vertebrates

# --- Diversity estimate ---
estimate:
  described: 6736
  low: 6736
  total: 7500
  high: 7500
  confidence: High
  source:
    key: Burgin 2018
    doi: 10.1093/jmammal/gyx147
    pdf: papers/estimate.pdf
    note: |
      Live successor is the Mammal Diversity Database (mammaldiversity.org);
      the published-paper citation is Burgin 2018.

# --- Canonical tree ---
tree:
  file: tree.nwk
  ntips: 5912
  dated: true
  source:
    key: Upham 2019
    study: Upham NS, Esselstyn JA, Jetz W (2019)
    doi: 10.1371/journal.pbio.3000494
    pdf: papers/tree.pdf
  methods:
    inference: bayesian
    software: [MrBayes 3.2.6, RAxML 8.2.3, PartitionFinder 1.1.1]
    data_type: supermatrix
    n_loci: 31
    n_genes: 31
    total_bp: 39099
    substitution_model: GTR+G, nine-partition
    dating_method: "Backbone-and-patch; NDexp (node-dated, exponential priors); also FBD published"
    fossil_calibrations: null
    support_metric: posterior_probability
    support_typical: "Most nodes PP>0.95; explicit weak placements include Atlantogenata root (≈0.53) and Myzopodidae bats."
    divergence_ci_available: true
    divergence_ci_note: "95% HPD on every internal node; 10,000-tree posterior credible set published (atlas ships MCC consensus only)."
    posterior_n: 10000

# --- Uncertainty data (posterior samples, HPD intervals) ---
# Upham 2019 publishes two parallel credible sets (node-dated NDexp; tip-dated
# FBD), 10,000 trees each. The full sets exceed GitHub's 100 MB file limit
# and are distributed via the author's institutional / VertLife repository.
uncertainty:
  host: VertLife / GitHub
  host_url: https://github.com/n8upham/MamPhy_v1
  host_doi: null
  external_archive_url: http://vertlife.org/data/mammals/
  files:
    - name: MamPhy_BDvr_Completed_5911sp_topoCons_NDexp_v2_sample100_PATCHES.tre
      label: Posterior sub-sample (100 of 10,000, NDexp)
      description: |
        Small downloadable sample (100 trees) from the NDexp 10,000-tree
        credible set, on the 28-patch backbone topology. The full 5911-tip
        credible set is hosted externally at vertlife.org/data/mammals/.
      size_bytes: 72640
      format: NEXUS
      url: https://github.com/n8upham/MamPhy_v1/raw/master/_DATA/MamPhy_BDvr_Completed_5911sp_topoCons_NDexp_v2_sample100_28PATCHES_patchNames.tre
    - name: MamPhy_BDvr_Completed_5911sp_topoCons_NDexp_MCC_v2.tre
      label: MCC tree (NDexp, 5911 species, with annotations)
      description: |
        The full-species MCC consensus from the node-dated (NDexp) credible
        set, with TreeAnnotator node annotations including 95% HPD divergence
        intervals. The atlas's mammals.nwk is the simplified Newick version.
      size_bytes: null
      format: NEXUS
      url: http://vertlife.org/data/mammals/
    - name: Full credible set — NDexp 10,000 trees
      label: Full posterior (10,000 chronograms, NDexp)
      description: |
        Complete BEAST credible set. Several hundred MB; hosted at vertlife.org
        because it exceeds GitHub's 100 MB file limit. Also available for the
        parallel FBD tip-dating analysis.
      size_bytes: null
      format: NEXUS (large)
      url: http://vertlife.org/data/mammals/
  note: |
    The atlas ships only the MCC consensus (mammals.nwk). The full 10,000-tree
    credible sets, posterior trace logs, and BEAST/MrBayes XML files live at
    the original Upham 2019 hosting points listed above.

# --- Resolution log ---
resolutions:
  - issue: "Upham 2019 fossil-calibration count not yet extracted (requires S1 Appendix read)."
    resolved_by: "Deferred. Methods block carries the calibration strategy (NDexp + FBD, two parallel dating runs); exact fossil count is a low-impact detail and noted as 'see S1 Appendix' rather than blocking verification."
  - issue: "Marsupial sub-clade candidate not settled — initial scan found only older candidates (Meredith 2008)."
    resolved_by: "Deferred. The atlas already carries marsupials through the Upham 2019 supermatrix; a dedicated marsupial tree is supplementary, not a coverage gap. Re-scan in a later session."

# --- Audit linkage ---
audit:
  file: ../../../audits/partitions/mammals.md
  status: verified
  last_audited: 2026-05-17

# --- Sub-clades ---
sub_phylos:
  - slug: primates
  - slug: carnivora
  - slug: cetaceans
