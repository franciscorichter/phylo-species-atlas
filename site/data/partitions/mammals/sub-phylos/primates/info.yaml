slug: primates
taxon: Primates
parent: mammals
parent_category: Vertebrates

tree:
  file: tree.nwk
  ntips: 272                                # atlas-derived: one tip per species (pruned from 301)
  derivation: |
    Derived from the 301-tip Arnold 2010 10kTrees v3 MCC by pruning to a
    single representative per species (smallest numeric tip ID under each
    Genus_species). 9.6% subspecies-level redundancy in the original tree
    (34 subspecies-suffixed tips like Gorilla_gorilla_gorilla).
    Reproducible via scripts/derive_species_tree.py.
  species_represented: 272
  dated: true
  source:
    key: Arnold 2010
    study: Arnold C, Matthews LJ, Nunn CL (2010)
    doi: 10.1002/evan.20251
    pdf: papers/tree.pdf
  methods:
    inference: bayesian
    software: ["Bayesian inference (paper does not specify suite)"]
    data_type: multi-locus
    n_loci: null
    n_genes: null
    substitution_model: null
    dating_method: "Bayesian relaxed clock; calibrations from Springer et al."
    support_metric: posterior_probability
    support_typical: null
    divergence_ci_available: true
    divergence_ci_note: "100-tree posterior available via 10kTrees download portal."
    posterior_n: 100
    note: "Methods block is a placeholder — 10kTrees v3 dataset documentation in Evolutionary Anthropology covers it; needs a detailed read."

species_count:
  source: IUCN Red List 2025
  described: 522
  coverage_pct_described: 52.1                # 272 / 522 (species-level)

uncertainty:
  files:
    - name: multi-individual.tree.nwk
      label: Original 301-tip multi-individual MCC (locally hosted)
      description: |
        The published Arnold 2010 10kTrees v3 MCC with 301 tips representing
        272 species (9.6% subspecies/specimen redundancy). The atlas-derived
        272-tip canonical above is pruned from this tree.
      format: Newick (standardized IDs)
      url: data/partitions/mammals/sub-phylos/primates/uncertainty/multi-individual.tree.nwk
      local: true
