caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~760 described haptophytes (coccolithophores + non-calcifying). Exceptional fossil record from coccolith microfossils gives strong calibrations. Liu 2009, Bendif 2016 published dated phylogenomic frameworks.

