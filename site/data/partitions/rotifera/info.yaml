      doi: 10.1093/sysbio/syae025
      study: "Mauer KM, Schmidt H, Dittrich M, Fröbius AC, Hellmann SL, Zischler H et al. (2024) — Genomics and transcriptomics of epizoic Seisonidea reveal ancestral parasitic features in Acanthocephala-Rotifera. Mol Biol Evol — phylogenomic resolution."
