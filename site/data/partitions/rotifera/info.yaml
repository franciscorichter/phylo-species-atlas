caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~2,200 described rotifers (Monogononta + Bdelloidea + Seisonidea). Many bdelloids are ancient asexual lineages with cryptic diversity. Mauer 2024 published a phylogenomic dated framework but coverage remains backbone-level.

