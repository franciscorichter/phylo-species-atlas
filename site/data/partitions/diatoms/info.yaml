    key: Nakov 2018
    study: "Nakov T, Beaulieu JM, Alverson AJ (2018) — Accelerated diversification is related to life history and locomotion in a hyperdiverse lineage of microbial eukaryotes (Diatoms, Bacillariophyta). New Phytologist 219:462-473."
