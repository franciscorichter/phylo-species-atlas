    key: Parks 2018
    study: "Parks MB, Wickett NJ, Alverson AJ (2018) — A computational framework for assessing single-locus phylogenetic substitution models. Mol Biol Evol — atlas-shipped phylogenomic ASTRAL species tree (94 tips, undated)."
    doi: 10.1093/molbev/msx268
