dated_alternatives:
  reason_canonical_undated: |
    PROMOTED 2026-05-19 — Nakov 2018 (244 dated tips, treePL,
    Zenodo 10.5281/zenodo.583628) is now the diatom canonical, replacing
    Parks 2018 (94 tips, undated). The candidates list below tracks
    complementary dated sub-clade trees beyond the canonical.
  candidates:
    - key: Nakov 2019
      doi: 10.1111/evo.13585
      study: "Nakov T, Beaulieu JM, Alverson AJ (2019) — Diatoms diversify and turn over faster in freshwater than marine environments. Evolution 73:2497-2511."
      scope: Diatom freshwater-marine transitions, dated
      tips: ~244
      note: "Companion analysis from same dataset; useful for habitat-transition rate inference."
    - key: Ruck 2016
      doi: 10.1016/j.ympev.2016.07.023
      study: "Ruck EC, Nakov T, Alverson AJ, Theriot EC (2016) — Phylogeny, ecology, morphological evolution, and reclassification of the diatom orders Surirellales and Rhopalodiales. Mol Phyl Evol 103:155-171."
      scope: Surirellales + Rhopalodiales (sub-order), dated
      tips: ~140
      note: "Sub-order dated tree useful for fine-scale diversification questions in pennate diatoms."
    - key: Theriot 2025
      doi: 10.1073/pnas.2500153122
      study: "Theriot EC et al. (2025) — Phylogenomics reveals the slow-burning fuse of diatom evolution. PNAS."
      scope: Deep-time diatom phylogenomics, dated
      tips: ~100
      note: "Newest deep-time chronogram — complements Nakov 2018 with updated calibrations."

