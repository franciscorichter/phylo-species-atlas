caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~1,300 described acanthocephalans. García-Varela 2012 (J Parasitol) and Verweyen 2011 published 18S/28S-based dated phylogenies at family level. No comprehensive species-level chronogram. All are obligate vertebrate parasites; phylogenomic data sparse.

