      study: "Silberfeld T, Leigh JW, Verbruggen H, Cruaud C, de Reviers B, Rousseau F (2010) — A multi-locus time-calibrated phylogeny of the brown algae (Heterokonta, Ochrophyta, Phaeophyceae): Investigating the evolutionary nature of the 'brown algal crown radiation'. Mol Phyl Evol 56:659-674."
