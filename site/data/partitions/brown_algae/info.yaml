caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~2,000 described brown algae (Phaeophyceae, Stramenopiles). Silberfeld 2010 (Mol Phyl Evol) and Bringloe 2020 published phylogenomic dated frameworks. Class-level coverage is reasonable; species-level limited.

