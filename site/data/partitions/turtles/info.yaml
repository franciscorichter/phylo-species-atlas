# Turtles — partition metadata for the web app.
#
# Derived from the verified subset of audits/partitions/turtles.md and the
# paper's data_estimates.csv. Note: the estimate-source DOI in the paper's
# data_sources.csv is broken (404); this info.yaml carries the working
# replacement (TTWG 2025) without modifying the paper data.

partition: Turtles
slug: turtles
category: Vertebrates

# --- Diversity estimate ---
estimate:
  # Values from the paper's data_estimates.csv (Turtles row).
  described: 360
  low: 360
  total: 360
  high: 370
  confidence: High
  source:
    # data_sources.csv cites TTWG 2021 (v9), but its DOI returns 404.
    # We surface the live TTWG 2025 (v10) edition as the working reference.
    # Both editions are recorded so the audit trail stays intact.
    paper_key: TTWG 2021                      # what data_sources.csv currently cites
    paper_doi: 10.3854/crm.8.000c.checklist.atlas.v9.2021
    paper_doi_status: broken                  # returns 404 on Crossref and doi.org
    live_key: TTWG 2025
    live_doi: 10.3854/crm.10.checklist.atlas.v10.2025
    live_year: 2025
    live_cited_value: 364
    pdf: papers/estimate.pdf                  # TTWG 2025 PDF (40 MB monograph)
    url: https://iucn-tftsg.org/checklist/
    note: |
      Live successor is the IUCN-TFTSG Turtles of the World checklist; the
      paper-side citation (v9/2021) had a broken DOI and was replaced here by
      the v10/2025 edition (species count 360 → 364). The 4-species delta is
      net taxonomic change since 2021.

# --- Canonical tree ---
tree:
  file: tree.nwk
  ntips: 593                                 # 591 turtles + 2 outgroups (paper)
  unique_ids: 329                            # numeric IDs in the file
  species_represented: 279                   # paper: 279 of 348 living species
  coverage_pct_described: 80                 # rounded — paper states 80%
  dated: true
  multiple_individuals_per_species: true
  source:
    key: Thomson 2021
    study: Thomson RC, Spinks PQ, Shaffer HB (2021)
    doi: 10.1073/pnas.2012215118
    pdf: papers/tree.pdf
  methods:
    inference: bayesian
    software: [MrBayes 3.2, BEAST 1.8.2]
    data_type: multi-locus
    n_loci: 15
    n_genes: 15
    substitution_model: "HKY per partition (BEAST divergence-time run)"
    dating_method: "Uncorrelated lognormal relaxed clock; birth-death tree prior"
    fossil_calibrations: 22
    support_metric: posterior_probability
    support_typical: "PP=1 on deep splits; all 14 families monophyletic; 98% of genera represented."
    divergence_ci_available: true
    divergence_ci_note: "95% HPD on internal nodes; 100-tree posterior credible set (atlas ships MCC consensus only)."
    posterior_n: 100

# --- Uncertainty data (posterior samples, HPD intervals) ---
# The atlas ships only the MCC consensus tree; everything below lives at the
# original data host and is reachable via the download links here. Sizes are
# from the host's file listing as of the audit date.
uncertainty:
  host: Dryad
  host_url: https://datadryad.org/dataset/doi:10.5061/dryad.jh9w0vt8w
  host_doi: 10.5061/dryad.jh9w0vt8w
  files:
    - name: sampleFromPosterior.100.tre
      label: Posterior sample (100 chronograms)
      description: |
        100 time-calibrated trees drawn from the BEAST posterior distribution.
        Used in Thomson 2021 for downstream diversification analyses; carries
        the divergence-time uncertainty that the MCC consensus collapses.
      size_bytes: 2766973
      format: NEXUS
      url: https://datadryad.org/downloads/file_stream/559160
    - name: bd.mcc.median_heights.tre
      label: MCC tree with median node heights
      description: |
        Maximum-clade-credibility consensus with median heights (and node
        annotations including 95% HPD on divergence times when opened in
        FigTree or similar).
      size_bytes: 310771
      format: NEXUS
      url: https://datadryad.org/downloads/file_stream/559156
    - name: turtle.288.bd.xml
      label: BEAST XML configuration
      description: |
        Full BEAST input XML — taxon sampling, calibration priors, clock
        model, MCMC settings. Use to reproduce the dating run.
      size_bytes: 4433875
      format: BEAST XML
      url: https://datadryad.org/downloads/file_stream/559161
  note: |
    Dryad serves files through a Cloudflare challenge that blocks programmatic
    fetches. Click-through to a browser is reliable. The atlas does not
    mirror these files locally so that Dryad remains the canonical version.

# --- Resolution log (caveats once surfaced, now resolved via UI overrides) ---
resolutions:
  - issue: "Estimate-source DOI in data_sources.csv (TTWG 2021) returns 404."
    resolved_by: "Web app substitutes TTWG 2025 via estimate.source.live_doi; surfaced as a DOI-correction block on the partition detail panel."
  - issue: "data_provenance.csv methods_brief says '13 loci for 294 species'; paper actually reports 15 loci and 279 species."
    resolved_by: "Web app reads authoritative figures from tree.methods (n_loci=15) and tree.species_represented (=279) instead of the CSV methods_brief."
  - issue: "Tree has 593 tip positions, 329 unique IDs, 279 species — multiple individuals per species used to test species-level monophyly."
    resolved_by: "Property of the tree (not a bug). Web app surfaces 'Multiple individuals per species' as an informational metadata field with the breakdown."

# --- Audit linkage ---
audit:
  file: ../../../audits/partitions/turtles.md
  status: verified
  last_audited: 2026-05-17

# --- Sub-clades ---
sub_phylos: []                               # no shipped sub-clade trees for turtles
