    overall_classification: fully-heuristic
    auditor_note: |
      AUDIT CORRECTION: this interval was initially classified as
      paper-published-range based on its bilateral structure (1300<1282<1450<1600).
      OpenAlex retrieval of Weigmann 2016's abstract shows the paper reports
      1,188 chondrichthyan species as of 7 Nov 2015 — 16 orders, 61 families,
      199 genera. No bilateral 1300–1600 true-diversity estimate appears in
      the abstract. The atlas's range is therefore atlas-derived rather than
      paper-published, and the partition reclassifies as fully-heuristic.
      The CITED source (Weigmann 2016) is valid for the described count;
      the interval bounds simply aren't its claims.

