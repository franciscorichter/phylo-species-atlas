caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~6,000 described. All obligate parasites of animals (Plasmodium = malaria; Toxoplasma; Cryptosporidium; etc.). Janouškovec 2019 published phylogenomic synthesis. Sub-clade dated trees exist for Plasmodium, Toxoplasma.

