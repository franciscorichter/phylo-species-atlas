      doi: 10.1186/s12915-018-0492-9
      study: "Holzer AS, Bartošová-Sojková P, Born-Torrijos A, Lövy A, Hartigan A, Fiala I (2018) — The joint evolution of the Myxozoa and their alternate hosts. BMC Biol 16:51."
      scope: Phylum-level dated phylogeny with host evolution
      tips: ~110
      note: "Standard dated framework integrating fish and annelid hosts."
    - key: Chang 2015
      doi: 10.1073/pnas.1511468112
      study: "Chang ES, Neuhof M, Rubinstein ND, Diamant A, Philippe H, Huchon D, Cartwright P (2015) — Genomic insights into the evolutionary origin of Myxozoa within Cnidaria. PNAS 112:14912-14917."
      scope: Phylogenomic placement within Cnidaria + deep dating
      tips: ~12
      note: "Confirms Myxozoa nested in Cnidaria; foundational paper."

