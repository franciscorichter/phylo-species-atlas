caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~2,400 described myxozoans. Highly derived endoparasites (now placed within Cnidaria via Chang 2015 phylogenomics). Sub-class dated trees exist (Holzer 2018, Atkinson 2018) but no species-level synthesis. Species discovery is fast — many cryptic species in fish hosts.

