caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~1,500 described tardigrades. Molecular phylogenies exist at family/
      genus level (Guidetti 2017, Bertolani 2014) but species-level
      sampling is extremely sparse. Tardigrades are notoriously difficult
      to extract DNA from at scale; comprehensive species-level dated
      trees are not on the horizon.

dated_alternatives:
  reason_canonical_undated: |
    Family-level molecular phylogenies exist but no atlas-scale species
    tree. Most tardigrade species are known only from morphology;
    molecular sampling is concentrated in model genera (Ramazzottius,
    Hypsibius, Milnesium).
  candidates:
    - key: Guidetti 2017
      doi: 10.1016/j.ympev.2017.01.001
      study: "Guidetti R, Cesari M, Bertolani R, Altiero T, Rebecchi L (2017) — High diversity in species, reproductive modes and distribution within the Paramacrobiotus richtersi complex (Eutardigrada). Zool J Linn Soc — molecular phylogeny."
      scope: Sub-family dated phylogeny of Paramacrobiotus complex
      tips: ~30
      note: "Best available dated phylogeny for a tardigrade lineage. No phylum-wide species tree available."
    - key: Bertolani 2014
      doi: 10.1016/j.ympev.2013.09.009
      study: "Bertolani R, Guidetti R, Marchioro T, Altiero T, Rebecchi L, Cesari M (2014) — Phylogeny of Eutardigrada: New molecular data and their morphological support lead to the identification of new evolutionary lineages. Mol Phyl Evol 76:110-126."
      scope: Eutardigrada (sub-class) molecular phylogeny
      tips: ~50
      note: "Class-level molecular framework; not fully time-calibrated."

