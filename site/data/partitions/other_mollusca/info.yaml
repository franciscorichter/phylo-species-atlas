caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~1,500 described non-cephalopod non-bivalve non-gastropod mollusks. Class-level dated phylogenomics exists (Kocot 2011, Smith 2011) but no species-level synthesis. Polyplacophora has the best coverage.

