caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~2,400 described Amoebozoa (slime molds + lobose amoebae). True diversity may be 10x higher — single-cell eukaryotes are systematically undersampled. Kang 2017 (Curr Biol) and Cavalier-Smith 2015 published phylogenomic dated frameworks.

