tree: null
caveats:
  - severity: medium
    summary: "No canonical tree shipped in the atlas."
    detail: |
      ~2,700 described scorpions across 22 families. Sharma 2018 (Mol
      Phyl Evol) published a revised dated phylogeny that places major
      family divergences in the Paleozoic — covers ~110 taxa at backbone
      level only. Species-level chronograms exist for individual genera
      (Buthidae, Vaejovidae) but no comprehensive species-level tree
      bridging them. The Sharma 2018 backbone Newick is feasible to add.

dated_alternatives:
  reason_canonical_undated: |
    Backbone phylogenomic dating exists (Sharma 2018, ~110 taxa) but
    species-level scaling across all 22 families has not been published.
  candidates:
    - key: Sharma 2018
      doi: 10.1016/j.ympev.2018.01.003
      study: "Sharma PP, Baker CM, Cosgrove JG, Johnson JE, Oberski JT, Raven RJ et al. (2018) — A revised dated phylogeny of scorpions: Phylogenomic support for ancient divergence of the temperate Gondwanan family Bothriuridae. Mol Phyl Evol 122:7-13."
      scope: Family-level dated scorpion phylogeny
      tips: ~110
      note: "Phylogenomic backbone with relaxed-clock dating; resolves deep scorpion divergences."
    - key: Santibáñez-López 2020
      doi: 10.1071/IS19033
      study: "Santibáñez-López CE, Ojanguren-Affilastro AA, Sharma PP (2020) — Another one bites the dust: taxonomic sampling of a key genus in phylogenomic datasets reveals more non-monophyletic groups. Invertebr Syst 34:323."
      scope: Refined Sharma 2018 with updated sampling
      tips: ~115
      note: "Most recent phylogenomic dating; resolves Vaejovidae paraphyly."

